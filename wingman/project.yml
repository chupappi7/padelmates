name: Wingman
options:
  bundleIdPrefix: com.thinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
targets:
  Wingman:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wingman
    info:
      path: Wingman/Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        WingmanWorkerURL: $(WINGMAN_WORKER_URL)
        WingmanAppKey: $(WINGMAN_APP_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinh.wingman
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
